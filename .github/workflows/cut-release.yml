# Releases are deliberately cut by hand from main. The version is derived from
# annotated vX.Y.Z tags by scripts/next-version.sh; callers never type it in.
name: Cut Release

on:
  workflow_dispatch:

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  release:
    name: validate, tag, and release
    runs-on: [self-hosted]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: refuse to cut from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "### Refused to cut a release"
            echo "Cut Release runs on \`main\` only, but was dispatched on \`${GITHUB_REF}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Cut Release runs on main only, but was dispatched on ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bazelbuild/setup-bazelisk@v3

      - name: validate Bazel module
        run: |
          bash scripts/check-public-boundary.sh
          bazel build //...
          bazel test --build_tests_only --@rules_go//go/config:race //... --test_output=errors

      - name: start two ClickHouse nodes with shared Keeper
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="arbiter-core-release-${suffix}"
          ch_a="arbiter-core-release-clickhouse-a-${suffix}"
          ch_b="arbiter-core-release-clickhouse-b-${suffix}"
          docker rm -f "${ch_a}" "${ch_b}" >/dev/null 2>&1 || true
          docker network rm "${network}" >/dev/null 2>&1 || true
          docker network create "${network}"
          docker run -d --rm \
            --name "${ch_a}" \
            --hostname "${ch_a}" \
            --network "${network}" \
            --network-alias arbiter-core-clickhouse-a \
            -p 127.0.0.1::9000 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/scripts/ci/clickhouse-shared-keeper-server.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
            clickhouse/clickhouse-server:25.8
          docker run -d --rm \
            --name "${ch_b}" \
            --hostname "${ch_b}" \
            --network "${network}" \
            -p 127.0.0.1::9000 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/scripts/ci/clickhouse-shared-keeper-client.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
            clickhouse/clickhouse-server:25.8
          port_a="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "9000/tcp") 0).HostPort}}' "${ch_a}")"
          port_b="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "9000/tcp") 0).HostPort}}' "${ch_b}")"
          {
            echo "CH_ADDR=127.0.0.1:${port_a}"
            echo "CH_REPLICA_ADDR=127.0.0.1:${port_b}"
            echo "CH_A_CONTAINER=${ch_a}"
            echo "CH_B_CONTAINER=${ch_b}"
            echo "CH_NETWORK=${network}"
          } >> "$GITHUB_ENV"

      - name: wait for ClickHouse and shared Keeper
        run: |
          for _ in $(seq 1 30); do
            if docker exec "${CH_A_CONTAINER}" clickhouse-client --query "SELECT 1" >/dev/null 2>&1 && \
               docker exec "${CH_B_CONTAINER}" clickhouse-client --query "SELECT 1" >/dev/null 2>&1 && \
               docker exec "${CH_B_CONTAINER}" clickhouse-client --query "SELECT count() FROM system.zookeeper WHERE path = '/'" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${CH_A_CONTAINER}"
          docker logs "${CH_B_CONTAINER}"
          exit 1

      - name: validate SNode integration
        env:
          ARBITER_CH_INTEGRATION: "1"
          ARBITER_CH_KEEPER: "1"
          ARBITER_CH_REPLICA: "1"
        run: |
          bazel test \
            //dataplane/ddl:ddl_test \
            //snode:snode_test \
            //verifier:verifier_test \
            --test_env=ARBITER_CH_INTEGRATION \
            --test_env=ARBITER_CH_KEEPER \
            --test_env=ARBITER_CH_REPLICA \
            --test_env=CH_ADDR \
            --test_env=CH_REPLICA_ADDR \
            --test_timeout=900 \
            --test_output=errors

      - name: stop ClickHouse and remove its network
        if: always()
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ch_a="${CH_A_CONTAINER:-arbiter-core-release-clickhouse-a-${suffix}}"
          ch_b="${CH_B_CONTAINER:-arbiter-core-release-clickhouse-b-${suffix}}"
          network="${CH_NETWORK:-arbiter-core-release-${suffix}}"
          docker rm -f "${ch_a}" "${ch_b}" >/dev/null 2>&1 || true
          docker network rm "${network}" >/dev/null 2>&1 || true

      - name: compute next version
        id: version
        run: |
          set -euo pipefail
          version="$(bash scripts/next-version.sh)"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::tag ${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cutting ${version}"
            echo "commit: ${GITHUB_SHA}, ref: ${GITHUB_REF}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: push annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      - name: create GitHub release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.VERSION
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            })

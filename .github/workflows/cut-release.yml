# Releases are deliberately cut by hand from main. The version is derived from
# annotated vX.Y.Z tags by scripts/next-version.sh; callers never type it in.
name: Cut Release

on:
  workflow_dispatch:

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  release:
    name: validate, tag, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: refuse to cut from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "### Refused to cut a release"
            echo "Cut Release runs on \`main\` only, but was dispatched on \`${GITHUB_REF}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Cut Release runs on main only, but was dispatched on ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bazelbuild/setup-bazelisk@v3

      - name: validate Bazel module
        run: |
          bash scripts/check-public-boundary.sh
          bazel build //...
          bazel test --@rules_go//go/config:race //... --test_output=errors

      - name: start ClickHouse
        run: |
          docker run -d --rm \
            --name arbiter-core-release-clickhouse \
            -p 9000:9000 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:25.8

      - name: wait for ClickHouse
        run: |
          for _ in $(seq 1 30); do
            timeout 1 bash -c '</dev/tcp/127.0.0.1/9000' && exit 0
            sleep 1
          done
          docker logs arbiter-core-release-clickhouse
          exit 1

      - name: validate SNode integration
        env:
          ARBITER_CH_INTEGRATION: "1"
          CH_ADDR: 127.0.0.1:9000
        run: |
          bazel test \
            //snode:snode_test \
            //verifier:verifier_test \
            --test_env=ARBITER_CH_INTEGRATION \
            --test_env=CH_ADDR \
            --test_timeout=900 \
            --test_output=errors

      - name: compute next version
        id: version
        run: |
          set -euo pipefail
          version="$(bash scripts/next-version.sh)"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::tag ${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cutting ${version}"
            echo "commit: ${GITHUB_SHA}, ref: ${GITHUB_REF}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: push annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      - name: create GitHub release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.VERSION
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            })

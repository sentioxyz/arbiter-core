name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: enforce public repository boundary
        run: bash scripts/check-public-boundary.sh
      - name: build
        run: bazel build //...
      - name: test
        run: bazel test --@rules_go//go/config:race //... --test_output=errors

  integration-clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 9000:9000
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: wait for ClickHouse
        run: |
          for _ in $(seq 1 30); do
            timeout 1 bash -c '</dev/tcp/127.0.0.1/9000' && exit 0
            sleep 1
          done
          exit 1
      - name: SNode integration
        env:
          ARBITER_CH_INTEGRATION: "1"
          CH_ADDR: 127.0.0.1:9000
        run: |
          bazel test \
            //snode:snode_test \
            //verifier:verifier_test \
            --test_env=ARBITER_CH_INTEGRATION \
            --test_env=CH_ADDR \
            --test_timeout=900 \
            --test_output=errors
